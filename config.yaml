# ─────────────────────────────────────────────────────────────────────────────
# brain — a multi-agent model of cognition (Global Workspace Theory)
# ─────────────────────────────────────────────────────────────────────────────

# Where to load OpenRouter credentials from. Expanded with ~.
specter_env: "~/specter/.env"

openrouter:
  # `provider` selects a built-in profile: openrouter (remote, paid),
  # ollama (local, :11434), lmstudio (local, :1234), vllm (local, :8000),
  # llamacpp (local, :8080), or custom. Profile defaults can be overridden
  # by setting base_url / require_auth / api_key_env / extra_headers directly.
  provider: "lmstudio"

  # Two model tiers. Reflex = fast/cheap regions; executive = slow/strong.
  # Model IDs must match exactly what LM Studio is serving (GET /v1/models).
  models:
    reflex:    "nvidia/nemotron-3-nano-omni"
    executive: "qwen3.6-35b-a3b-uncensored-genesis-v2-apex-mtp"
  timeout_seconds: 300                                  # 35B + M4 = patient
  max_retries: 1

# Sandbox: every effector is confined to this directory (created if missing).
sandbox_dir: "~/brain/workspace"

# The reactive cognitive loop.
# Note: with the autoregressive stream-of-thought prefrontal, `max_cycles` is
# reinterpreted as the max number of thought-units in the chain (the analogue
# of max generated tokens). 6–8 is a good range for deliberation; raise to
# 12+ for action-heavy tasks that need many tool calls.
loop:
  max_cycles: 8
  attention_decay: 0.85   # how fast un-rebroadcast items lose salience each cycle

memory:
  db_path: "~/brain/memory.sqlite3"
  retrieve_k: 5           # episodes pulled into the workspace per retrieval

  # Embedding backend for retrieve_semantic.
  #   "tfidf"               — pure Python, no deps (default fallback)
  #   "openrouter"          — HTTP /embeddings via the configured provider
  #                            (works for OpenRouter AND any OpenAI-compatible
  #                            local server like LM Studio / vLLM / llama.cpp)
  #   "sentence_transformers" — local, free; needs `pip install sentence-transformers`
  embedding_backend: "openrouter"
  embedding_model: "text-embedding-embeddinggemma-300m-qat"

  # End-of-task consolidation knobs (see brain/consolidator.py).
  consolidate_window: 40
  consolidate_min_cluster: 3
  consolidate_max_facts: 2

effectors:
  filesystem:
    enabled: true
  shell:
    enabled: true
    require_confirmation: true   # prompt before running shell commands
    timeout_seconds: 30
  web:
    enabled: true
    timeout_seconds: 30

# Region → tier assignment. Tweak freely.
regions:
  sensory_cortex:    reflex
  amygdala:          reflex
  basal_ganglia:     reflex
  hippocampus:       reflex
  prefrontal:        executive
  broca:             executive
  # humanization regions
  interoception:     reflex   # deterministic, no LLM call anyway
  default_mode:      reflex   # tangents should feel half-formed
  locus_coeruleus:   reflex   # deterministic
  vta:               reflex   # deterministic

# Learned forward model (trained during NREM sleep on world-model triples).
#   backend: "auto" (MLX on Apple silicon, else numpy) | "mlx" | "numpy"
# MLX is the robust GPU-trained net (residual MLP, AdamW, cosine LR, dropout,
# early stop); numpy is the dependency-light fallback. Needs a dense embedding
# backend; no-ops on TF-IDF / too little data.
forward_model:
  backend: "auto"
  hidden: 256
  depth: 2
  epochs: 200
  lr: 0.001
  min_rows: 40

# Humanization — persistent mood/drives/distractions and an ambient world.
# Set humanize=false to fall back to the vanilla GWT brain (for A/B eval).
humanize: true

# Loadable persona file (biographical priors + implicit Big-Five-lite traits).
# Each persona seeds AffectState.traits and pre-loads facts into hippocampus.
persona_path: "personas/alex.yaml"

# Ambient world scenario. See brain/world.py SCENARIOS:
#   neutral | calm_morning | deadline_night | boring_afternoon |
#   social_evening | sick_day
scenario: "boring_afternoon"

# Embodiment — eyes + hands on the host computer, via the `afferent` package
# (pip install afferent). Disabled by default. When enabled, the brain gains
# a `look` effector + an occipital region (eyes) and, if the backend supports
# it, `screen_click` / `screen_type` / `screen_key` (hands).
#   backend:  "fake" (scripted, safe) | "macos" (screencapture + cliclick)
#   read_only: true = eyes only; hands refuse until set false (SAFE DEFAULT)
embodiment:
  enabled: true
  backend: "macos"
  read_only: true
  max_actions_per_min: 20
  settle_ms: 400
  observe_every: 3            # occipital posts a vision broadcast every N steps
  describe_with_vision: true  # describe screenshots via the vision model
  vision_model: ""            # blank = reflex-tier model

# Screen observation — the brain passively watches your screen to learn your
# activity. PRIVACY-FIRST: refuses to run unless the LLM/embedding endpoint is
# local (localhost); embeds the screenshot then DELETES the pixels; never
# captures excluded apps; nothing leaves the machine. Requires embodiment
# enabled (it uses the eyes; read_only is fine). The daemon runs capture; the
# screen_purger (NREM) enforces retention. Off by default.
capture:
  enabled: true
  # Triggers (any fires): app-switch (immediate) | activity-settle (you just
  # acted, then paused — idle within [1s, activity_window_seconds]) | fallback
  # timer (capture at least every interval_seconds even with no input).
  interval_seconds: 90        # fallback: max seconds between captures when idle
  min_interval_seconds: 8     # debounce floor (activity/fallback; app-switch bypasses)
  activity_window_seconds: 8  # idle <= this (and >= 1s) counts as "just settled"
  change_detect: true         # skip the VLM+embed when the screen is ~unchanged
  vision_model: ""            # blank = reflex-tier model
  # Screen-state representation for the sequence model:
  #   "none"   — embed the text description (EmbeddingGemma) [default]
  #   "dinov2" — embed the screenshot with local DINOv2 (needs torch; no uploads)
  #   "auto"   — DINOv2 if torch+model load, else text
  visual_embed: "none"
  min_train_pairs: 40         # min observation pairs before the sequence model trains
  # presence: the brain sleeps when you step away (idle past the threshold —
  # screensaver / lock / no input) and wakes when you return. Capture pauses
  # while away (nothing but a lock screen to see) — that's when heavy NREM/REM
  # processing runs. presence_sleep makes this the dominant wake/sleep trigger.
  presence_sleep: true
  away_threshold_seconds: 300
  exclude_apps:               # never captured (substring match on app name)
    - "1Password"
    - "Bitwarden"
    - "Keychain Access"
    - "Messages"
    - "Signal"
    - "WhatsApp"
    - "Banking"
  # retention (screen_purger, runs during NREM sleep)
  max_age_days: 30
  max_rows: 20000
  max_dir_mb: 200
